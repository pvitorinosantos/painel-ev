<!-- SCRIPT DE TESTE COM FILTRO E HISTÓRICO COMPLETO -->
  <script>
    var chartC = null, chartG = null;

    // Dados base simulados de viagens/recargas
    var historicoMeses = [
      { mes: '10/2026', dist: 583.0, recargas: 73.76, termico: 624.26, economia: 550.50, carro: 'Frota' },
      { mes: '09/2026', dist: 1240.5, recargas: 145.20, termico: 1328.00, economia: 1182.80, carro: 'Dolphin Mini' },
      { mes: '08/2026', dist: 1150.0, recargas: 138.00, termico: 1231.00, economia: 1093.00, carro: 'Dolphin Mini' }
    ];

    window.onload = function() {
      atualizarFiltroVeiculo();
    };

    function processarArquivoCarllog(e) {
      alert('Arquivo processado com sucesso!');
      atualizarFiltroVeiculo();
    }

    function atualizarFiltroVeiculo() {
      var veiculoSel = document.getElementById('filtro-veiculo-global').value;

      // Valores padrão (Frota Total)
      var dist = 583.0, rec = 73.76, term = 624.26, econ = 550.50, consumo = '11,6', custoKm = '0,127', co2 = '47,2';

      if (veiculoSel === 'Dolphin Mini') {
        dist = 577.0; rec = 73.76; term = 617.50; econ = 543.74; consumo = '11,5'; custoKm = '0,128'; co2 = '46,7';
      } else if (veiculoSel === 'Yuan Pro') {
        dist = 6.0; rec = 0.00; term = 6.76; econ = 6.76; consumo = '15,0'; custoKm = '0,000'; co2 = '0,5';
      }

      // Atualiza os KPIs na tela
      document.getElementById('kpi-distancia').textContent = dist.toLocaleString('pt-BR', {minimumFractionDigits: 1}) + ' km';
      document.getElementById('kpi-recargas').textContent = 'R$ ' + rec.toLocaleString('pt-BR', {minimumFractionDigits: 2});
      document.getElementById('kpi-custo-km').textContent = custoKm + ' R$/km';
      document.getElementById('kpi-consumo').textContent = consumo + ' kWh/100km';
      document.getElementById('kpi-co2').textContent = co2 + ' kg';
      document.getElementById('kpi-economia').textContent = 'R$ ' + econ.toLocaleString('pt-BR', {minimumFractionDigits: 2});

      // Exibe ou oculta os cards de resumo individual
      var containerResumo = document.getElementById('container-resumo-veiculos');
      if (containerResumo) {
        if (veiculoSel === 'todos') containerResumo.classList.remove('hidden');
        else containerResumo.classList.add('hidden');
      }

      // Preenche Tabela de Histórico Dinamicamente
      var tbody = document.querySelector('tbody');
      if (tbody) {
        tbody.innerHTML = ''; // Limpa a linha única
        
        historicoMeses.forEach(function(item) {
          if (veiculoSel !== 'todos' && item.carro !== 'Frota' && item.carro !== veiculoSel) return;

          var tr = document.createElement('tr');
          tr.className = 'hover:bg-[#0F1A36]/50 transition';
          tr.innerHTML = `
            <td class="p-2 text-cyan-400 font-bold">${item.mes}</td>
            <td class="p-2 text-right">${item.dist.toLocaleString('pt-BR', {minimumFractionDigits: 1})} km</td>
            <td class="p-2 text-right text-emerald-400 font-bold">R$ ${item.recargas.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
            <td class="p-2 text-right text-rose-400">R$ ${item.termico.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
            <td class="p-2 text-right text-emerald-400 font-bold">R$ ${item.economia.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      // Redesenha gráficos
      desenharGraficos();
    }

    function desenharGraficos() {
      var ctx1 = document.getElementById('chartConsumo').getContext('2d');
      if (chartC) chartC.destroy();
      chartC = new Chart(ctx1, {
        type: 'line',
        data: {
          labels: ['10-01', '10-02', '10-04', '10-05', '10-06', '10-07', '10-08', '10-09', '10-13', '10-14', '10-15', '10-16', '10-17', '10-18'],
          datasets: [{
            data: [16.5, 12.1, 16.2, 11.5, 13.8, 12.2, 13.5, 8.8, 12.5, 14.8, 11.2, 15.8, 19.5, 11.0],
            borderColor: '#00E5FF',
            fill: true,
            backgroundColor: 'rgba(0, 229, 255, 0.1)',
            tension: 0.3
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#94A3B8', font: { size: 9 } }, grid: { color: '#142347' } }, y: { ticks: { color: '#94A3B8', font: { size: 9 } }, grid: { color: '#142347' } } } }
      });

      var ctx2 = document.getElementById('chartGastos').getContext('2d');
      if (chartG) chartG.destroy();
      chartG = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: ['Elétrico Real', 'Combustível Ref.'],
          datasets: [{
            data: [73.76, 624.26],
            backgroundColor: ['#10B981', '#F43F5E'],
            borderRadius: 6,
            barThickness: 45
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#94A3B8', font: { size: 10 } }, grid: { display: false } }, y: { ticks: { color: '#94A3B8', font: { size: 9 } }, grid: { color: '#142347' } } } }
      });
    }
  </script>
